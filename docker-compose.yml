version: "3.8"

services:
  discord-bot:
    build: .
    container_name: lain-discord-bot
    env_file: .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "print('alive')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
