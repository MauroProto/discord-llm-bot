[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "discord-llm-bot"
version = "0.1.0"
description = "Self-hosted Discord bot with multi-provider LLM (Claude, GPT, Gemini, OpenRouter, Ollama, Codex CLI) and ElevenLabs voice"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "MauroProto"}]
keywords = ["discord", "bot", "llm", "claude", "gpt", "gemini", "voice", "elevenlabs", "tts", "stt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

# Same as requirements.txt — kept in sync. requirements.txt is what the
# Docker image and the bash installer use; pyproject.toml is what `pipx
# install` and `pip install .` use.
dependencies = [
    "discord.py>=2.3.0",
    "anthropic>=0.28.0",
    "openai>=1.50.0",
    "google-genai>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "aiohttp>=3.8.0",
    # PyNaCl 1.6.x patches CVE-2025-69277 but discord.py 2.7.1 voice extra
    # caps it at <1.6 — see requirements.txt for full context.
    "PyNaCl>=1.5.0,<1.6",
    "discord-ext-voice-recv>=0.5.2a179",
    "elevenlabs>=1.5.0",
    'audioop-lts; python_version >= "3.13"',
]

[project.urls]
Homepage = "https://discord-llm-bot.vercel.app"
Repository = "https://github.com/MauroProto/discord-llm-bot"
Issues = "https://github.com/MauroProto/discord-llm-bot/issues"

[project.scripts]
# `discord-llm-bot` (the CLI) → cli.main. With pipx this becomes a
# globally available command on PATH.
discord-llm-bot = "cli:main"

# Flat layout: every Python file in the repo root is a top-level module
# (bot, config, wizard, claude_client, ...). Plus the providers and
# personalities packages.
[tool.setuptools]
py-modules = [
    "cli",
    "wizard",
    "bot",
    "config",
    "claude_client",
    "context_manager",
    "elevenlabs_client",
    "mcp_config",
    "search_client",
    "voice_manager",
]
packages = ["providers", "personalities"]
include-package-data = true

[tool.setuptools.package-data]
personalities = ["*.md"]
