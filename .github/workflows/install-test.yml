name: install-test

on:
  push:
    branches: [main]
    paths:
      - "scripts/install.sh"
      - "wizard.py"
      - "cli.py"
      - "pyproject.toml"
      - "requirements.txt"
      - "bot.py"
      - "config.py"
      - "providers/**"
      - "personalities/**"
      - ".github/workflows/install-test.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    name: install.sh end-to-end (ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run installer pointing at the local checkout
        env:
          # Point the installer at this checkout so we test the file we just
          # pushed, not whatever is on the main branch right now.
          DISCORD_LLM_BOT_REPO: ${{ github.workspace }}
          DISCORD_LLM_BOT_DIR: /tmp/discord-llm-bot-install
          DISCORD_LLM_BOT_BIN_DIR: /tmp/bin
        run: bash scripts/install.sh

      - name: Verify install layout
        env:
          DIR: /tmp/discord-llm-bot-install
          BIN: /tmp/bin
        run: |
          set -e
          test -d "$DIR" && echo "ok install dir"
          test -f "$DIR/wizard.py" && echo "ok wizard.py"
          test -f "$DIR/cli.py" && echo "ok cli.py"
          test -f "$DIR/pyproject.toml" && echo "ok pyproject.toml"
          test -f "$DIR/bot.py" && echo "ok bot.py"
          test -d "$DIR/.venv" && echo "ok venv"
          test -x "$BIN/discord-llm-bot" && echo "ok launcher"

      - name: Launcher subcommands
        env:
          DIR: /tmp/discord-llm-bot-install
          BIN: /tmp/bin
        run: |
          set -e
          "$BIN/discord-llm-bot" path | grep -q "discord-llm-bot-install"
          "$BIN/discord-llm-bot" help | grep -q "interactive setup"

      - name: Doctor (no .env yet — should report issues but not crash)
        env:
          BIN: /tmp/bin
        run: |
          # Doctor exits 1 when .env is missing; we just check it doesn't crash.
          "$BIN/discord-llm-bot" doctor || true

      - name: Non-interactive setup populates .env
        env:
          DIR: /tmp/discord-llm-bot-install
          BIN: /tmp/bin
          # Pin the data dir into the test sandbox so we can verify .env was
          # written. Without this, cli.py writes to $HOME/.discord-llm-bot/.
          DLBOT_HOME: /tmp/discord-llm-bot-data
          DISCORD_BOT_TOKEN: dummy_token_for_ci
          LLM_PROVIDER: ollama
          OLLAMA_BASE_URL: http://localhost:11434/v1
          OLLAMA_MODEL: llama3.3
          BOT_PERSONALITY: friendly
          ENABLE_VOICE: "false"
        run: |
          set -e
          "$BIN/discord-llm-bot" from-env
          test -f "$DLBOT_HOME/.env" && echo "ok .env written"
          grep -q "LLM_PROVIDER=ollama" "$DLBOT_HOME/.env"
          grep -q "BOT_PERSONALITY=friendly" "$DLBOT_HOME/.env"

      - name: Bot module imports
        env:
          DIR: /tmp/discord-llm-bot-install
        run: |
          set -e
          # Smoke-import the bot package so we catch syntax errors / missing
          # symbols early. Real Discord connection is not tested here.
          cd "$DIR"
          "$DIR/.venv/bin/python3" -c "
          import importlib
          for mod in ['config', 'mcp_config', 'providers', 'personalities', 'context_manager', 'search_client', 'cli']:
              importlib.import_module(mod)
              print(f'ok import {mod}')
          # bot.py runs side-effects on import (creates client, etc.) so we
          # only AST-parse it instead.
          import ast, pathlib
          for f in ['bot.py', 'voice_manager.py', 'elevenlabs_client.py', 'wizard.py']:
              ast.parse(pathlib.Path(f).read_text())
              print(f'ok parse {f}')
          "

  pipx:
    name: pipx install (ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pipx
        run: |
          python3 -m pip install --user pipx
          python3 -m pipx ensurepath

      - name: Install via pipx from local checkout
        run: |
          # --pip-args='--pre' is required because discord-ext-voice-recv
          # only ships pre-releases.
          ~/.local/bin/pipx install . --pip-args='--pre'

      - name: discord-llm-bot subcommands
        env:
          DLBOT_HOME: /tmp/dlbot-pipx-data
        run: |
          set -e
          ~/.local/bin/discord-llm-bot help | grep -q "interactive setup"
          ~/.local/bin/discord-llm-bot path

      - name: from-env via pipx-installed CLI
        env:
          DLBOT_HOME: /tmp/dlbot-pipx-data
          DISCORD_BOT_TOKEN: dummy_token
          LLM_PROVIDER: ollama
          OLLAMA_MODEL: llama3.3
          BOT_PERSONALITY: friendly
        run: |
          set -e
          ~/.local/bin/discord-llm-bot from-env
          test -f "$DLBOT_HOME/.env" && echo "ok .env written"
          grep -q "LLM_PROVIDER=ollama" "$DLBOT_HOME/.env"
